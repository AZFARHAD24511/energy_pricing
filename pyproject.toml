[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-pricing"
version = "0.1.0"
description = "Modular electricity price data validation and modelling pipeline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "PyYAML>=6.0", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
